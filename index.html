<script>
(function(){
  "use strict";

  /* ------------------------------------------------------------------ *
   *  Constants & move table
   * ------------------------------------------------------------------ */
  const SPACING = 1.03;
  const CUBIE_SIZE = 0.94;
  const CUBIE_RADIUS = 0.045;
  const STICKER_SIZE = 0.87;
  const STICKER_RADIUS = 0.095;
  const STICKER_DEPTH = 0.018;
  const MOVE_DURATION = 520;   // ms per quarter/half turn
  const STEP_INTERVAL = 2500;  // ms between move starts in sequence mode
  const COMPLETE_VISIBLE_MS = 3000;
  const COUNTDOWN_MS = 1900;

  const COLORS = {
    U: 0xF7F7F5, // white
    D: 0xFFD84D, // yellow
    F: 0x3FA34D, // green
    B: 0x2F6FED, // blue
    R: 0xE0432B, // red
    L: 0xFF8A1E, // orange
    core: 0x111114
  };

  // face -> {axis, layer, angle(deg) for a CLOCKWISE quarter turn}
  const MOVES = {
    U: { axis: 'y', layer:  1, angle: -90 },
    D: { axis: 'y', layer: -1, angle:  90 },
    R: { axis: 'x', layer:  1, angle: -90 },
    L: { axis: 'x', layer: -1, angle:  90 },
    F: { axis: 'z', layer:  1, angle: -90 },
    B: { axis: 'z', layer: -1, angle:  90 },
  };

  const TOKEN_RE = /^([UDLRFB])(2|'|’)?$/;

  function easeInOutQuad(t){ return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2; }
  function easeInOutCubic(t){ return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2; }
  function delayCancelable(ms, isCanceled){
    return new Promise(resolve=>{
      let waited = 0;
      const step = 40;
      const iv = setInterval(()=>{
        waited += step;
        if (isCanceled() || waited >= ms){ clearInterval(iv); resolve(); }
      }, step);
    });
  }

  function waitForNextMove(startTime, isCanceled){
    return new Promise(resolve=>{
      const check = ()=>{
        if (isCanceled() || performance.now() - startTime >= STEP_INTERVAL / sequenceSpeed){
          resolve();
          return;
        }
        setTimeout(check, 32);
      };
      check();
    });
  }

  function parseSequence(raw){
    const rawTokens = raw.trim().split(/\s+/).filter(Boolean);
    if (rawTokens.length === 0) return { ok:false, error:'Digite ao menos um movimento.' };
    const moves = [];
    for (let i=0;i<rawTokens.length;i++){
      const tok = rawTokens[i].replace('’',"'");
      const m = TOKEN_RE.exec(tok);
      if (!m){
        return { ok:false, error:`Movimento inválido: "${rawTokens[i]}" (posição ${i+1}). Use letras F B R L U D, sozinhas ou seguidas de ' ou 2.` };
      }
      const face = m[1];
      const suffix = m[2] ? m[2].replace('’',"'") : '';
      const base = MOVES[face];
      let angle = base.angle;
      if (suffix === "'") angle = -angle;
      else if (suffix === '2') angle = angle * 2;
      const notation = face + (suffix === "'" ? '\u2032' : suffix);
      moves.push({ face, suffix, axis: base.axis, layer: base.layer, angle, notation });
    }
    return { ok:true, moves };
  }

  /* ------------------------------------------------------------------ *
   *  Three.js scene
   * ------------------------------------------------------------------ */
  const canvas = document.getElementById('cube-canvas');
  const wrap = document.getElementById('cube-wrap');

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
  camera.position.set(4.4, 3.6, 5.3);
  camera.lookAt(0,0,0);

  const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

  scene.add(new THREE.AmbientLight(0xffffff, 0.72));
  const key = new THREE.DirectionalLight(0xffffff, 0.55);
  key.position.set(5, 8, 6);
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xffffff, 0.28);
  fill.position.set(-6, -3, -4);
  scene.add(fill);

  const orientationGroup = new THREE.Group(); // user free-look / reset-to-standard
  const cubeGroup = new THREE.Group();        // holds the 27 cubies, logical solve state
  orientationGroup.add(cubeGroup);
  scene.add(orientationGroup);

  let cubies = [];

  function buildMaterials(x,y,z){
    // BoxGeometry face order: +x, -x, +y, -y, +z, -z
    const mat = () => new THREE.MeshStandardMaterial({ color: COLORS.core, roughness: 0.68, metalness: 0 });
    return [mat(), mat(), mat(), mat(), mat(), mat()];
  }

  function createStickerGeometry(){
    const half = STICKER_SIZE / 2;
    const r = STICKER_RADIUS;
    const shape = new THREE.Shape();
    shape.moveTo(-half + r, -half);
    shape.lineTo(half - r, -half);
    shape.quadraticCurveTo(half, -half, half, -half + r);
    shape.lineTo(half, half - r);
    shape.quadraticCurveTo(half, half, half - r, half);
    shape.lineTo(-half + r, half);
    shape.quadraticCurveTo(-half, half, -half, half - r);
    shape.lineTo(-half, -half + r);
    shape.quadraticCurveTo(-half, -half, -half + r, -half);

    const geometry = new THREE.ExtrudeGeometry(shape, {
      depth: STICKER_DEPTH,
      steps: 1,
      bevelEnabled: true,
      bevelSegments: 2,
      bevelSize: 0.012,
      bevelThickness: 0.009,
      curveSegments: 6
    });
    geometry.translate(0, 0, -STICKER_DEPTH / 2);
    geometry.computeVertexNormals();
    return geometry;
  }

  function addSticker(cubie, color, position, rotation){
    const material = new THREE.MeshStandardMaterial({ color, roughness: 0.48, metalness: 0.015 });
    const sticker = new THREE.Mesh(createStickerGeometry(), material);
    sticker.position.copy(position);
    sticker.rotation.set(rotation.x, rotation.y, rotation.z);
    cubie.add(sticker);
  }

  function addExteriorStickers(cubie, x, y, z){
    const offset = CUBIE_SIZE / 2 + 0.012;
    if (x === 1) addSticker(cubie, COLORS.R, new THREE.Vector3(offset,0,0), new THREE.Euler(0,Math.PI/2,0));
    if (x === -1) addSticker(cubie, COLORS.L, new THREE.Vector3(-offset,0,0), new THREE.Euler(0,-Math.PI/2,0));
    if (y === 1) addSticker(cubie, COLORS.U, new THREE.Vector3(0,offset,0), new THREE.Euler(-Math.PI/2,0,0));
    if (y === -1) addSticker(cubie, COLORS.D, new THREE.Vector3(0,-offset,0), new THREE.Euler(Math.PI/2,0,0));
    if (z === 1) addSticker(cubie, COLORS.F, new THREE.Vector3(0,0,offset), new THREE.Euler(0,0,0));
    if (z === -1) addSticker(cubie, COLORS.B, new THREE.Vector3(0,0,-offset), new THREE.Euler(0,Math.PI,0));
  }

  function createRoundedBoxGeometry(size, radius, segments){
    const geometry = new THREE.BoxGeometry(size, size, size, segments, segments, segments);
    const position = geometry.attributes.position;
    const half = size / 2;
    const inner = half - radius;
    const vertex = new THREE.Vector3();
    const anchor = new THREE.Vector3();

    for (let i = 0; i < position.count; i++){
      vertex.fromBufferAttribute(position, i);
      anchor.set(
        THREE.MathUtils.clamp(vertex.x, -inner, inner),
        THREE.MathUtils.clamp(vertex.y, -inner, inner),
        THREE.MathUtils.clamp(vertex.z, -inner, inner)
      );
      vertex.sub(anchor);
      if (vertex.lengthSq() > 0) vertex.normalize().multiplyScalar(radius);
      vertex.add(anchor);
      position.setXYZ(i, vertex.x, vertex.y, vertex.z);
    }

    position.needsUpdate = true;
    geometry.computeVertexNormals();
    return geometry;
  }

  function rebuildSolvedCube(){
    // clear
    cubies.forEach(c => c.traverse(part => {
      if (part.geometry) part.geometry.dispose();
      if (Array.isArray(part.material)) part.material.forEach(m=>m.dispose());
      else if (part.material) part.material.dispose();
    }));
    cubeGroup.clear();
    cubies = [];

    const geo = createRoundedBoxGeometry(CUBIE_SIZE, CUBIE_RADIUS, 6);

    for (let x=-1;x<=1;x++){
      for (let y=-1;y<=1;y++){
        for (let z=-1;z<=1;z++){
          const mesh = new THREE.Mesh(geo, buildMaterials(x,y,z));
          mesh.position.set(x*SPACING, y*SPACING, z*SPACING);
          addExteriorStickers(mesh, x, y, z);
          mesh.userData.pos = { x, y, z };
          cubeGroup.add(mesh);
          cubies.push(mesh);
        }
      }
    }
  }
  rebuildSolvedCube();

  function resizeRenderer(){
    const size = wrap.clientWidth;
    if (!size) return;
    renderer.setSize(size, size, false);
    camera.aspect = 1;
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resizeRenderer).observe(wrap);
  resizeRenderer();

  (function loop(){
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  })();

  /* ------------------------------------------------------------------ *
   *  Free rotation (drag) — only active while allowed
   * ------------------------------------------------------------------ */
  let dragEnabled = true;
  let dragging = false;
  let lastX = 0, lastY = 0;
  const DRAG_SENS = 0.008;

  function pointerDown(e){
    if (!dragEnabled) return;
    dragging = true;
    const p = e.touches ? e.touches[0] : e;
    lastX = p.clientX; lastY = p.clientY;
  }
  function pointerMove(e){
    if (!dragging || !dragEnabled) return;
    const p = e.touches ? e.touches[0] : e;
    const dx = p.clientX - lastX, dy = p.clientY - lastY;
    lastX = p.clientX; lastY = p.clientY;
    const qy = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), dx*DRAG_SENS);
    const qx = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), dy*DRAG_SENS);
    orientationGroup.quaternion.premultiply(qy).premultiply(qx);
    if (e.touches) e.preventDefault();
  }
  function pointerUp(){ dragging = false; }

  canvas.addEventListener('mousedown', pointerDown);
  window.addEventListener('mousemove', pointerMove);
  window.addEventListener('mouseup', pointerUp);
  canvas.addEventListener('touchstart', pointerDown, { passive:true });
  window.addEventListener('touchmove', pointerMove, { passive:false });
  window.addEventListener('touchend', pointerUp);

  function setDragEnabled(v){
    dragEnabled = v;
    canvas.classList.toggle('locked', !v);
    document.getElementById('rotate-hint').style.opacity = v ? '1' : '0';
  }

  /* ------------------------------------------------------------------ *
   *  Layer turn animation
   * ------------------------------------------------------------------ */
  function rotatePos(pos, axis, angleDeg){
    const rad = angleDeg * Math.PI/180;
    const cos = Math.round(Math.cos(rad));
    const sin = Math.round(Math.sin(rad));
    let { x, y, z } = pos;
    if (axis === 'x') return { x, y: y*cos - z*sin, z: y*sin + z*cos };
    if (axis === 'y') return { x: x*cos + z*sin, y, z: -x*sin + z*cos };
    return { x: x*cos - y*sin, y: x*sin + y*cos, z };
  }

  function playMove(move){
    return new Promise(resolve=>{
      const { axis, layer, angle } = move;
      const layerCubies = cubies.filter(c => Math.round(c.userData.pos[axis]) === layer);
      const pivot = new THREE.Group();
      cubeGroup.add(pivot);
      layerCubies.forEach(c => pivot.attach(c));

      const targetRad = THREE.MathUtils.degToRad(angle);
      const start = performance.now();

      function frame(now){
        const t = Math.min((now-start)/MOVE_DURATION, 1);
        pivot.rotation[axis] = targetRad * easeInOutQuad(t);
        if (t < 1){
          requestAnimationFrame(frame);
        } else {
          layerCubies.forEach(c=>{
            cubeGroup.attach(c);
            c.userData.pos = rotatePos(c.userData.pos, axis, angle);
            c.userData.pos.x = Math.round(c.userData.pos.x);
            c.userData.pos.y = Math.round(c.userData.pos.y);
            c.userData.pos.z = Math.round(c.userData.pos.z);
            c.position.set(c.userData.pos.x*SPACING, c.userData.pos.y*SPACING, c.userData.pos.z*SPACING);
          });
          cubeGroup.remove(pivot);
          resolve();
        }
      }
      requestAnimationFrame(frame);
    });
  }

  function invertMove(move){
    return { axis: move.axis, layer: move.layer, angle: -move.angle };
  }

  /* ------------------------------------------------------------------ *
   *  App state machine
   * ------------------------------------------------------------------ */
  const els = {
    input: document.getElementById('seq-input'),
    error: document.getElementById('seq-error'),
    inputPanel: document.getElementById('input-panel'),
    stripPanel: document.getElementById('strip-panel'),
    strip: document.getElementById('strip'),
    statusPanel: document.getElementById('status-panel'),
    moveCurrent: document.getElementById('move-current'),
    moveNext: document.getElementById('move-next'),
    progressBar: document.getElementById('progress-bar'),
    progressLabel: document.getElementById('progress-label'),
    controls: document.getElementById('controls'),
    countdownOverlay: document.getElementById('countdown-overlay'),
    countdownNum: document.getElementById('countdown-num'),
    completeOverlay: document.getElementById('complete-overlay'),
    completeSub: document.getElementById('complete-sub'),
    rotateHint: document.getElementById('rotate-hint'),
    modeSequence: document.getElementById('mode-opt-sequence'),
    modeStep: document.getElementById('mode-opt-step'),
    modeCaption: document.getElementById('mode-caption'),
  };

  const MODE_CAPTIONS = {
    sequence: 'Os movimentos avançam sozinhos, um a cada 2,5s.',
    step: 'Você avança um movimento por vez, no seu ritmo.',
  };

  let moves = [];
  let idx = 0;
  let mode = 'sequence'; // 'sequence' | 'step'
  let appState = 'input'; // input | aligning | countdown | playing | paused | step-waiting | animating | completed | free
  let animating = false;
  let playToken = 0; // increments to cancel stale playback loops
  let inputValid = false;
  let completionVisible = false;
  let completionTimer = null;
  let pausedFreeLook = false;
  let sequenceSpeed = 1;
  const SPEED_OPTIONS = [1, 1.5, 2];

  function clearCompletion(){
    completionVisible = false;
    if (completionTimer){
      clearTimeout(completionTimer);
      completionTimer = null;
    }
  }

  function setAppState(s){ appState = s; render(); }

  function paintModeSelect(){
    els.modeSequence.setAttribute('aria-checked', String(mode === 'sequence'));
    els.modeStep.setAttribute('aria-checked', String(mode === 'step'));
    els.modeCaption.textContent = MODE_CAPTIONS[mode];
  }
  els.modeSequence.addEventListener('click', ()=>{ mode = 'sequence'; paintModeSelect(); render(); });
  els.modeStep.addEventListener('click', ()=>{ mode = 'step'; paintModeSelect(); render(); });
  paintModeSelect();

  els.input.addEventListener('input', ()=>{
    const v = els.input.value;
    if (!v.trim()){
      inputValid = false;
      els.error.classList.add('hidden');
      render();
      return;
    }
    const result = parseSequence(v);
    if (result.ok){
      els.error.classList.add('hidden');
      inputValid = true;
    } else {
      els.error.textContent = result.error;
      els.error.classList.remove('hidden');
      inputValid = false;
    }
    render();
  });

  els.input.addEventListener('keydown', e=>{
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && inputValid){
      e.preventDefault();
      onStartClick();
    }
  });

  function onStartClick(){
    const result = parseSequence(els.input.value);
    if (!result.ok) return;
    moves = result.moves;
    idx = 0;
    buildStrip();
    els.stripPanel.classList.remove('hidden');
    els.statusPanel.classList.remove('hidden');
    setDragEnabled(false);
    beginCountdown();
  }

  function buildStrip(){
    els.strip.innerHTML = '';
    moves.forEach((m, i)=>{
      const chip = document.createElement('span');
      chip.className = 'chip flex-none px-2 py-1 rounded-md text-[13px] border border-transparent text-faint';
      chip.textContent = m.notation;
      chip.dataset.i = i;
      els.strip.appendChild(chip);
    });
  }

  function updateStrip(){
    const chips = els.strip.children;
    for (let i=0;i<chips.length;i++){
      const chip = chips[i];
      chip.classList.remove('bg-ink','text-paper','text-faint','text-ink/40','opacity-40');
      if (i < idx){
        chip.className = 'chip flex-none px-2 py-1 rounded-md text-[13px] border border-transparent text-ink/30';
      } else if (i === idx){
        chip.className = 'chip flex-none px-2 py-1 rounded-md text-[13px] border border-ink bg-ink text-paper';
        chip.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
      } else {
        chip.className = 'chip flex-none px-2 py-1 rounded-md text-[13px] border border-transparent text-muted';
      }
    }
  }

  function updateStatus(){
    if (idx >= moves.length){
      els.moveCurrent.textContent = '—';
      els.moveNext.textContent = '';
    } else {
      els.moveCurrent.textContent = moves[idx].notation;
      els.moveNext.textContent = (idx+1 < moves.length) ? ('próximo ' + moves[idx+1].notation) : 'último movimento';
    }
    const total = moves.length;
    const current = Math.min(idx+1, total);
    els.progressLabel.textContent = total ? `${current} de ${total} movimentos` : '';
    const pct = total ? Math.round((idx/total)*100) : 0;
    els.progressBar.style.width = pct + '%';
  }

  function render(){
    // panels
    els.inputPanel.classList.toggle('hidden', appState !== 'input');
    els.countdownOverlay.classList.toggle('hidden', appState !== 'countdown');
    els.countdownOverlay.classList.toggle('flex', appState === 'countdown');
    els.completeOverlay.classList.toggle('hidden', !completionVisible);
    els.completeOverlay.classList.toggle('flex', completionVisible);
    const showRotateHint = dragEnabled && (appState === 'input' || appState === 'free' || (appState === 'paused' && pausedFreeLook));
    els.rotateHint.style.opacity = showRotateHint ? '1' : '0';

    updateStrip();
    updateStatus();
    renderControls();
  }

  function makeBtn(label, onClick, opts){
    opts = opts || {};
    const b = document.createElement('button');
    b.textContent = label;
    let style = 'bg-white text-ink border border-line hover:border-ink/40';
    if (opts.variant === 'primary') style = 'bg-ink text-paper';
    else if (opts.variant === 'stop') style = 'bg-white text-red-600/90 border border-red-200 hover:border-red-300 hover:bg-red-50/60';
    b.className = 'ctl-btn px-4 py-2 rounded-lg text-[13px] font-medium tracking-wide ' + style;
    b.disabled = !!opts.disabled;
    b.addEventListener('click', onClick);
    return b;
  }

  const CONTROL_ICONS = {
    pause: '<rect x="7" y="5" width="3" height="14" rx="1"/><rect x="14" y="5" width="3" height="14" rx="1"/>',
    play: '<path d="M8 5.5v13l10-6.5z"/>',
    back: '<path d="M9 7l-5 5 5 5"/><path d="M5 12h8a6 6 0 0 1 6 6"/>',
    restart: '<path d="M4 11a8 8 0 1 1 2.3 6"/><path d="M4 5v6h6"/>',
    stop: '<rect x="6" y="6" width="12" height="12" rx="2"/>',
    unlock: '<rect x="5" y="10" width="14" height="10" rx="2"/><path d="M9 10V7a4 4 0 0 1 7-2.6"/>',
    lock: '<rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
    next: '<path d="M5 5.5v13L15 12z"/><path d="M19 6v12"/>'
  };

  function makeIconBtn(label, icon, onClick, opts){
    opts = opts || {};
    const b = document.createElement('button');
    b.type = 'button';
    let variant = 'bg-transparent text-ink border border-line';
    if (opts.variant === 'primary') variant = 'icon-btn-primary border';
    else if (opts.variant === 'stop') variant = 'icon-btn-stop bg-transparent border';
    b.className = 'icon-btn ' + variant;
    b.disabled = !!opts.disabled;
    b.setAttribute('aria-label', label);
    b.title = label;
    b.innerHTML = `<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${CONTROL_ICONS[icon]}</svg>`;
    b.addEventListener('click', onClick);
    return b;
  }

  function controlsDivider(){
    const d = document.createElement('span');
    d.className = 'w-px h-5 bg-line mx-0.5 self-center hidden sm:inline-block';
    d.setAttribute('aria-hidden', 'true');
    return d;
  }

  function makeStartBtn(){
    const parsed = inputValid ? parseSequence(els.input.value) : null;
    const count = parsed && parsed.ok ? parsed.moves.length : 0;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'start-btn w-full min-h-[52px] rounded-xl px-4 sm:px-5 flex items-center justify-between gap-4 bg-ink text-paper text-left';
    b.disabled = !inputValid;
    b.setAttribute('aria-describedby', 'mode-caption');

    const label = document.createElement('span');
    label.className = 'font-medium text-[14px] tracking-wide';
    label.textContent = inputValid ? 'Começar sequência' : 'Digite uma sequência para começar';

    const detail = document.createElement('span');
    detail.className = 'flex items-center gap-2 shrink-0 text-[11px] text-paper/65 tabular-nums';
    if (count){
      const countLabel = document.createElement('span');
      countLabel.className = 'hidden sm:inline';
      countLabel.textContent = `${count} ${count === 1 ? 'movimento' : 'movimentos'}`;
      detail.appendChild(countLabel);
    }
    const arrow = document.createElement('span');
    arrow.className = 'start-arrow text-[18px] leading-none';
    arrow.setAttribute('aria-hidden', 'true');
    arrow.textContent = '→';
    detail.appendChild(arrow);

    b.append(label, detail);
    b.addEventListener('click', onStartClick);
    return b;
  }

  function makeSpeedControl(){
    const group = document.createElement('div');
    group.className = 'speed-control';
    group.setAttribute('role', 'group');
    group.setAttribute('aria-label', 'Velocidade da sequência');
    SPEED_OPTIONS.forEach(speed=>{
      const option = document.createElement('button');
      option.type = 'button';
      option.className = 'speed-option';
      option.textContent = String(speed).replace('.', ',') + '×';
      option.setAttribute('aria-pressed', String(sequenceSpeed === speed));
      option.setAttribute('aria-label', `Velocidade ${String(speed).replace('.', ',')} vezes`);
      option.addEventListener('click', ()=>{
        sequenceSpeed = speed;
        renderControls();
      });
      group.appendChild(option);
    });
    return group;
  }

  function renderControls(){
    els.controls.innerHTML = '';
    els.controls.classList.toggle('justify-center', appState !== 'input');
    const canGoBack = idx > 0 && !animating;

    if (mode === 'sequence' && (appState === 'playing' || appState === 'paused')){
      els.controls.appendChild(makeSpeedControl());
    }

    if (appState === 'input'){
      els.controls.appendChild(makeStartBtn());
      return;
    }

    if (appState === 'countdown' || appState === 'animating'){
      return; // no controls during motion, keep focus on the cube
    }

    if (appState === 'playing'){
      els.controls.appendChild(makeIconBtn('Pausar', 'pause', onPause, { variant:'primary' }));
      els.controls.appendChild(makeIconBtn('Voltar', 'back', onBack, { disabled:!canGoBack }));
      els.controls.appendChild(makeIconBtn('Reiniciar', 'restart', onRestart));
      els.controls.appendChild(makeIconBtn('Parar', 'stop', onStop, { variant:'stop' }));
      return;
    }

    if (appState === 'paused'){
      els.controls.appendChild(makeIconBtn('Continuar', 'play', onContinue, { variant:'primary' }));
      const lookButton = makeIconBtn(pausedFreeLook ? 'Travar cubo' : 'Destravar cubo', pausedFreeLook ? 'unlock' : 'lock', onTogglePausedLook);
      lookButton.setAttribute('aria-pressed', String(pausedFreeLook));
      els.controls.appendChild(lookButton);
      els.controls.appendChild(makeIconBtn('Voltar', 'back', onBack, { disabled:!canGoBack }));
      els.controls.appendChild(makeIconBtn('Reiniciar', 'restart', onRestart));
      els.controls.appendChild(makeIconBtn('Parar', 'stop', onStop, { variant:'stop' }));
      return;
    }

    if (appState === 'step-waiting'){
      els.controls.appendChild(makeIconBtn('Próximo movimento', 'next', onNext, { variant:'primary' }));
      els.controls.appendChild(makeIconBtn('Voltar', 'back', onBack, { disabled:!canGoBack }));
      els.controls.appendChild(makeIconBtn('Reiniciar', 'restart', onRestart));
      els.controls.appendChild(makeIconBtn('Parar', 'stop', onStop, { variant:'stop' }));
      return;
    }

    if (appState === 'completed' || appState === 'free'){
      els.controls.appendChild(makeBtn('Reiniciar', onRestart, { variant:'primary' }));
      els.controls.appendChild(makeBtn('Nova sequência', onNewSequence));
      if (appState === 'completed'){
        els.controls.appendChild(makeBtn('Rotação livre', onFreeRotate));
      }
      return;
    }
  }

  /* ---- actions ---- */
  function onPause(){
    pausedFreeLook = false;
    setDragEnabled(false);
    setAppState('paused');
  }
  function onTogglePausedLook(){
    pausedFreeLook = !pausedFreeLook;
    setDragEnabled(pausedFreeLook);
    render();
  }
  async function onContinue(){
    if (animating) return;
    pausedFreeLook = false;
    setDragEnabled(false);
    animating = true;
    setAppState('animating');
    await resetOrientation(480);
    animating = false;
    setAppState('playing');
    runSequenceLoop();
  }
  async function onNext(){
    if (animating || idx >= moves.length) return;
    animating = true; setAppState('animating');
    await playMove(moves[idx]);
    idx++;
    animating = false;
    if (idx >= moves.length){ onComplete(); }
    else { setAppState('step-waiting'); }
  }
  async function onBack(){
    if (animating || idx <= 0) return;
    pausedFreeLook = false;
    setDragEnabled(false);
    animating = true; setAppState('animating');
    await resetOrientation(380);
    await playMove(invertMove(moves[idx-1]));
    idx--;
    animating = false;
    setAppState(mode === 'sequence' ? 'paused' : 'step-waiting');
  }
  function onRestart(){
    playToken++; // cancel any running loop
    clearCompletion();
    pausedFreeLook = false;
    rebuildSolvedCube();
    orientationGroup.quaternion.identity();
    idx = 0;
    beginCountdown();
  }
  function onStop(){
    playToken++;
    clearCompletion();
    pausedFreeLook = false;
    rebuildSolvedCube();
    orientationGroup.quaternion.identity();
    idx = 0;
    els.stripPanel.classList.add('hidden');
    els.statusPanel.classList.add('hidden');
    setDragEnabled(true);
    setAppState('input');
  }
  function onNewSequence(){
    playToken++;
    clearCompletion();
    pausedFreeLook = false;
    rebuildSolvedCube();
    orientationGroup.quaternion.identity();
    moves = []; idx = 0;
    els.input.value = '';
    inputValid = false;
    els.error.classList.add('hidden');
    els.stripPanel.classList.add('hidden');
    els.statusPanel.classList.add('hidden');
    setDragEnabled(true);
    setAppState('input');
  }
  function onFreeRotate(){
    setDragEnabled(true);
    setAppState('free');
  }
  function onComplete(){
    els.completeSub.textContent = moves.length + ' movimentos realizados';
    setDragEnabled(false);
    clearCompletion();
    completionVisible = true;
    setAppState('completed');
    completionTimer = setTimeout(()=>{
      completionVisible = false;
      completionTimer = null;
      render();
    }, COMPLETE_VISIBLE_MS);
  }

  function resetOrientation(duration){
    return new Promise(resolve=>{
      const endQuat = new THREE.Quaternion();
      const startQuat = orientationGroup.quaternion.clone();
      const angle = startQuat.angleTo(endQuat);
      if (angle < 0.002){
        orientationGroup.quaternion.copy(endQuat);
        resolve();
        return;
      }
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches){
        orientationGroup.quaternion.copy(endQuat);
        resolve();
        return;
      }
      duration = Math.max(180, duration * Math.min(angle / Math.PI, 1));
      const start = performance.now();

      function frame(now){
        const t = Math.min((now-start)/duration, 1);
        orientationGroup.quaternion.slerpQuaternions(startQuat, endQuat, easeInOutCubic(t));
        if (t < 1){
          requestAnimationFrame(frame);
        } else {
          orientationGroup.quaternion.copy(endQuat);
          resolve();
        }
      }
      requestAnimationFrame(frame);
    });
  }

  async function beginCountdown(){
    setDragEnabled(false);
    setAppState('aligning');
    await resetOrientation(480);
    setAppState('countdown');
    const start = performance.now();

    function frame(now){
      const elapsed = now - start;
      els.countdownNum.textContent = elapsed < 950 ? '2' : (elapsed < COUNTDOWN_MS ? '1' : '');
      if (elapsed < COUNTDOWN_MS){
        requestAnimationFrame(frame);
      } else {
        beginPlayback();
      }
    }
    requestAnimationFrame(frame);
  }

  function beginPlayback(){
    updateStatus();
    if (mode === 'sequence'){
      setAppState('playing');
      runSequenceLoop();
    } else {
      setAppState('step-waiting');
    }
  }

  async function runSequenceLoop(){
    const token = playToken;
    while (appState === 'playing' && idx < moves.length && token === playToken){
      const t0 = performance.now();
      animating = true;
      await playMove(moves[idx]);
      animating = false;
      if (token !== playToken) return;
      idx++;
      if (idx >= moves.length){ onComplete(); return; }
      render();
      if (appState !== 'playing') return;
      await waitForNextMove(t0, ()=> appState !== 'playing' || token !== playToken);
    }
  }

  render();
})();
</script>

<script>
(function(){
  'use strict';
  const tabCube = document.getElementById('tab-cube');
  const tabTimer = document.getElementById('tab-timer');
  const scrambleEl = document.getElementById('timer-scramble');
  const pad = document.getElementById('timer-pad');
  const display = document.getElementById('timer-display');
  const instruction = document.getElementById('timer-instruction');
  const stateBadge = document.getElementById('timer-state');
  const status = document.getElementById('timer-status');
  const startButton = document.getElementById('timer-start');
  const pauseButton = document.getElementById('timer-pause');
  const continueButton = document.getElementById('timer-continue');
  const finishButton = document.getElementById('timer-finish');
  const resetButton = document.getElementById('timer-reset');
  const restartResultButton = document.getElementById('timer-restart');
  const saveResultButton = document.getElementById('timer-save');
  const newScrambleButton = document.getElementById('new-scramble');
  const input = document.getElementById('seq-input');
  const apply = document.getElementById('apply-scramble');
  const historyEl = document.getElementById('timer-history');
  const storeKey = 'cubo-embaralhado-times-v1';
  let times = JSON.parse(localStorage.getItem(storeKey) || '[]');
  let scramble = '';
  let phase = 'idle';
  let holdTimer = null;
  let activePress = false;
  let spacePressed = false;
  let saveFeedbackTimer = null;
  let runStart = 0;
  let finishedElapsed = 0;
  let raf = null;
  let worker = null;
  let workerId = 0;
  const fallbackFaces = ['R','L','U','D','F','B'];

  function format(ms){ return (ms / 1000).toFixed(2); }
  function average(list){ return list.length ? list.reduce((a,b)=>a+b,0)/list.length : null; }
  function makeFallback(){
    const out=[]; let prev='';
    for(let i=0;i<20;i++){
      let f; do { f=fallbackFaces[Math.floor(Math.random()*6)]; } while(f===prev); prev=f;
      out.push(f + (Math.random()<.34 ? '2' : (Math.random()<.5 ? "'" : '')));
    }
    return out.join(' ');
  }
  function setScramble(value){
    scramble = value || makeFallback();
    scrambleEl.textContent = scramble;
  }
  function makeWorker(){
    if(worker) return worker;
    const url = 'https://unpkg.com/cstimer_module@0.1.5/cstimer_module.js';
    worker = { pending:new Map(), ready:false };
    fetch(url).then(r=>r.text()).then(code=>{
      const blob = new Blob([code], {type:'text/javascript'});
      const w = new Worker(URL.createObjectURL(blob));
      worker.instance = w; worker.ready = true;
      w.onmessage = e=>{ const [id, type, result]=e.data; const resolve=worker.pending.get(id); if(resolve){worker.pending.delete(id); resolve(result);} };
      worker.pending.forEach((resolve,id)=>w.postMessage([id,'scramble',['333']]));
    }).catch(()=>{ worker.failed=true; });
    return worker;
  }
  function wcaScramble(){
    const w=makeWorker();
    return new Promise(resolve=>{
      if(w.failed) return resolve(makeFallback());
      const id=++workerId;
      let settled=false;
      const finish=value=>{
        if(settled) return;
        settled=true;
        w.pending.delete(id);
        resolve(value || makeFallback());
      };
      const send=()=>{
        if(w.instance && !settled) w.instance.postMessage([id,'scramble',['333']]);
      };
      const fallbackTimer=setTimeout(()=>finish(makeFallback()), 1200);
      w.pending.set(id, value=>{ clearTimeout(fallbackTimer); finish(value); });
      if(w.ready) send();
    });
  }
  function newScramble(){
    resetTimer();
    newScrambleButton.disabled=true;
    newScrambleButton.textContent='Gerando…';
    scrambleEl.textContent='Gerando scramble WCA…';
    status.textContent='Preparando um novo scramble…';
    wcaScramble().then(value=>{
      setScramble(value);
      newScrambleButton.disabled=false;
      newScrambleButton.textContent='Novo scramble';
      status.textContent='Novo scramble pronto';
    });
  }
  function stats(){
    const best=times.length ? Math.min(...times) : null;
    document.getElementById('clear-times').hidden = !times.length;
    const last5=times.slice(-5); const ao5=last5.length===5 ? average(last5) : null;
    document.getElementById('stat-best').textContent=best===null?'—':format(best);
    document.getElementById('stat-ao5').textContent=ao5===null?'—':format(ao5);
    document.getElementById('stat-count').textContent=String(times.length);
    historyEl.innerHTML='<div class="history-title"><span>Histórico</span><span>Mais recente primeiro</span></div>' + (times.slice().reverse().map((t,i)=>`<div class="history-row"><span>#${times.length-i}</span><strong>${format(t)} s</strong></div>`).join('') || '<p class="text-[12px] text-muted py-3 text-center">Seus tempos aparecerão aqui.</p>');
  }
  function save(){ localStorage.setItem(storeKey, JSON.stringify(times)); stats(); }
  function currentElapsed(){ return phase === 'running' ? performance.now() - runStart : 0; }
  function tick(){ if(phase!=='running') return; display.textContent=format(currentElapsed()); raf=requestAnimationFrame(tick); }
  function setState(kind){
    document.body.classList.toggle('timer-running', kind==='running');
    document.body.classList.toggle('timer-holding', kind==='holding' || kind==='ready');
    document.body.classList.toggle('timer-finished', kind==='finished');
    stateBadge.className='timer-state '+kind;
    stateBadge.textContent=kind==='running'?'Cronometrando':kind==='finished'?'Finalizado':'Pronto';
    pad.classList.toggle('running',kind==='running');
    pad.classList.toggle('holding',kind==='holding');
    pad.classList.toggle('ready',kind==='ready');
    display.classList.toggle('ready',kind==='ready');
    startButton.hidden = true;
    pauseButton.hidden = true;
    continueButton.hidden = true;
    finishButton.hidden = true;
    resetButton.hidden = true;
    resetButton.classList.toggle('result-action',kind==='finished');
    resetButton.textContent = kind==='finished' ? 'Preparar próximo' : '↻';
    resetButton.setAttribute('aria-label',kind==='finished'?'Preparar próximo tempo':'Reiniciar cronômetro');
    instruction.textContent = kind==='running'?'Pressione Espaço para finalizar':kind==='holding'?'Continue segurando':kind==='ready'?'Solte para iniciar':kind==='finished'?'Escolha o próximo passo':'Segure Espaço para preparar';
    pad.setAttribute('aria-label',instruction.textContent);
  }

  function resetTimer(){
    if(raf) cancelAnimationFrame(raf);
    if(holdTimer) clearTimeout(holdTimer);
    raf = null;
    holdTimer=null; activePress=false; spacePressed=false; finishedElapsed=0; phase='idle'; display.textContent='0.00'; status.textContent='';
    display.classList.remove('running','error'); setState('idle');
  }
  function beginHold(){
    if(phase==='running'){ finishTimer(); return; }
    if(phase==='finished') return;
    if(phase!=='idle' || activePress) return;
    activePress=true; phase='holding'; display.textContent='0.00'; status.textContent=''; setState('holding');
    holdTimer=setTimeout(()=>{
      holdTimer=null;
      if(activePress && phase==='holding'){ phase='ready'; setState('ready'); }
    }, 550);
  }
  function releaseHold(){
    if(!activePress) return;
    activePress=false;
    if(holdTimer){ clearTimeout(holdTimer); holdTimer=null; }
    if(phase==='holding'){ phase='idle'; setState('idle'); return; }
    if(phase==='ready') startTimer();
  }
  function startTimer(){
    phase='running'; runStart=performance.now(); display.textContent='0.00'; status.textContent='';
    display.classList.add('running'); setState('running'); tick();
  }
  function finishTimer(){
    if(phase!=='running') return;
    const elapsed=Math.round(currentElapsed()); if(raf)cancelAnimationFrame(raf); raf=null;
    phase='finished'; finishedElapsed=elapsed;
    display.textContent=format(elapsed); display.classList.remove('running'); status.textContent=''; setState('finished');
  }
  resetButton.addEventListener('click',resetTimer);
  restartResultButton.addEventListener('click',resetTimer);
  saveResultButton.addEventListener('click',()=>{
    if(phase!=='finished' || !finishedElapsed) return;
    times.push(finishedElapsed); save();
    saveResultButton.disabled=true;
    saveResultButton.textContent='Salvo';
    clearTimeout(saveFeedbackTimer);
    saveFeedbackTimer=setTimeout(()=>{
      saveResultButton.disabled=false;
      saveResultButton.textContent='Salvar tempo';
      resetTimer();
    }, 280);
  });
  pad.addEventListener('pointerdown',e=>{
    if(e.button!==undefined && e.button!==0) return;
    e.preventDefault();
    pad.setPointerCapture?.(e.pointerId);
    beginHold();
  });
  pad.addEventListener('pointerup',e=>{ e.preventDefault(); releaseHold(); });
  pad.addEventListener('pointercancel',releaseHold);
  window.addEventListener('keydown', e=>{
    if(!document.body.classList.contains('timer-mode') || e.code!=='Space') return;
    e.preventDefault();
    if(spacePressed) return;
    spacePressed=true;
    if(phase==='running') finishTimer();
    else beginHold();
  });
  window.addEventListener('keyup',e=>{
    if(document.body.classList.contains('timer-mode') && e.code==='Space'){
      e.preventDefault();
      if(!spacePressed) return;
      spacePressed=false;
      releaseHold();
    }
  });
  function cancelPreparation(){
    spacePressed=false;
    if(phase==='holding' || phase==='ready') resetTimer();
  }
  window.addEventListener('blur',cancelPreparation);
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) cancelPreparation(); });
  newScrambleButton.addEventListener('click',newScramble);
  apply.addEventListener('click',()=>{
    if(!scramble || apply.disabled) return;
    apply.disabled=true;
    apply.classList.add('applied');
    const originalLabel=apply.textContent;
    apply.textContent='Aplicado';
    input.value=scramble;
    input.dispatchEvent(new Event('input',{bubbles:true}));
    setTimeout(()=>{
      apply.disabled=false;
      apply.classList.remove('applied');
      apply.textContent=originalLabel;
      tabCube.click();
    }, 180);
  });
  document.getElementById('clear-times').addEventListener('click',()=>{
    if(!times.length || !window.confirm('Apagar todos os tempos do histórico?')) return;
    times=[]; save(); resetTimer(); status.textContent='Histórico limpo';
  });
  function select(mode){
    const timer=mode==='timer';
    if(!timer && phase==='running') finishTimer();
    document.body.classList.toggle('timer-mode',timer);
    tabCube.setAttribute('aria-selected',String(!timer));
    tabTimer.setAttribute('aria-selected',String(timer));
    if(timer){stats();if(!scramble)newScramble();}
  }
  tabCube.addEventListener('click',()=>select('cube')); tabTimer.addEventListener('click',()=>select('timer'));
  stats();
  setState('idle');
})();
</script>

</body>
